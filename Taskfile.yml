version: '3'

env:
  GOWORK: 'off'
  CGO_ENABLED: '1'

tasks:
  default:
    desc: Build the library and STDIO server
    cmds:
      - task: build

  list:
    desc: List available tasks
    cmds:
      - task --list-all

  ci:
    desc: Check formatting, modules, race tests, vet, and native builds (GOFLAGS=-tags=haybarn selects the Haybarn engine)
    cmds:
      - task: fmt-check
      - task: go-tidy-check
      - task: go-verify
      - task: whitespace-check
      - task: test-race
      - task: vet
      - task: build

  fmt:
    desc: Format Go source
    cmds:
      - go fmt ./...

  fmt-check:
    desc: Check Go formatting without modifying files
    cmds:
      - |
        set -eu
        unformatted_files=$(gofmt -l *.go cmd)
        if [ -n "$unformatted_files" ]; then
          printf '%s\n' "$unformatted_files"
          printf '%s\n' 'Run task fmt to format these files.' >&2
          exit 1
        fi

  go-tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  go-tidy-check:
    desc: Check module tidiness without modifying files
    cmds:
      - go mod tidy -diff

  go-verify:
    desc: Verify dependency checksums
    cmds:
      - go mod verify

  whitespace-check:
    desc: Check committed files and pending changes for whitespace errors
    cmds:
      - git --no-pager diff-tree --check "$(git hash-object -t tree /dev/null)" HEAD
      - git --no-pager diff --check
      - git --no-pager diff --cached --check

  test:
    desc: Run tests (pass flags after --)
    cmds:
      - go test -mod=readonly {{.CLI_ARGS}} ./...

  test-race:
    desc: Run uncached tests with the race detector
    cmds:
      - go test -mod=readonly -race -count=1 ./...

  fuzz:
    desc: Fuzz SQL isolation and result formatting (FUZZTIME=2m per target; FUZZ_TIMEOUT=10m must exceed it)
    vars:
      FUZZTIME: '{{default "2m" .FUZZTIME}}'
      FUZZ_TIMEOUT: '{{default "10m" .FUZZ_TIMEOUT}}'
      FUZZ_PARALLEL: '{{default "2" .FUZZ_PARALLEL}}'
    cmds:
      - for: [FuzzQueryIsolation, FuzzResultFormatting]
        cmd: go test -mod=readonly -run '^$' -fuzz '^{{.ITEM}}$' -fuzztime='{{.FUZZTIME}}' -parallel='{{.FUZZ_PARALLEL}}' -timeout='{{.FUZZ_TIMEOUT}}' .

  vet:
    desc: Run go vet
    cmds:
      - go vet -mod=readonly ./...

  build:
    desc: Build the library and CLI into bin/ntduckbox
    cmds:
      - go build -mod=readonly ./...
      - go build -mod=readonly -o bin/ntduckbox ./cmd/ntduckbox

  run:
    desc: Run the STDIO server (pass flags after --)
    interactive: true
    cmds:
      - go run ./cmd/ntduckbox {{.CLI_ARGS}}

  package:
    desc: Package a native CLI archive into dist/ (VERSION=vX.Y.Z; ENGINE=duckdb or haybarn)
    requires:
      vars: [VERSION]
    vars:
      ENGINE: '{{default "duckdb" .ENGINE}}'
    env:
      NTDUCKBOX_VERSION: '{{.VERSION}}'
      NTDUCKBOX_ENGINE: '{{.ENGINE}}'
    cmds:
      - sh scripts/package.sh
