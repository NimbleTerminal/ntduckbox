name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOWORK: 'off'
  CGO_ENABLED: '1'

jobs:
  check:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        go: ['1.26.x', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Preflight
        run: task ci
      - name: Haybarn engine tests and build
        if: matrix.go == 'stable'
        env:
          GOFLAGS: -tags=haybarn
        run: |
          task test-race
          task vet
          task build
      - name: Fuzz smoke tests
        if: matrix.os == 'ubuntu-24.04' && matrix.go == 'stable'
        run: task fuzz FUZZTIME=10s
      - name: Upload fuzz failures
        if: failure() && matrix.os == 'ubuntu-24.04' && matrix.go == 'stable'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Package tagged release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.go == '1.26.x'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          task package ENGINE=duckdb
          task package ENGINE=haybarn
      - name: Upload release archive
        if: startsWith(github.ref, 'refs/tags/v') && matrix.go == '1.26.x'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tagged CLI release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish archives and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum ./*.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
